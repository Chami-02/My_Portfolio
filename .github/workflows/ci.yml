name: CI Pipeline

on:
  push:
    # ⚠️ `sprint-*` ADDED. Until now CI ran only on master/main, so a sprint
    # branch got NO automated checks at all until its PR was opened — days or
    # weeks of work verified for the first time at the moment it was proposed
    # for merge. Feedback belongs on the first push, not the last.
    branches: [master, main, 'sprint-*']
  pull_request:
    branches: [master, main]

# ⚠️ LEAST PRIVILEGE. With no `permissions:` block a workflow gets the
# repository default, which is usually write access to contents, packages,
# issues and more. Nothing in this file needs to write anything, and a
# compromised third-party action inherits whatever the token can do.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-scan:
    name: Security - Credential Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for hardcoded admin credentials
        run: |
          set -uo pipefail

          PATTERN='Admin@1234!'

          # .html is deliberately NOT scanned. The design reference files
          # (Admin.dc.html and friends) legitimately contain this string and
          # are committed as-is. What this guard enforces is narrower: the
          # credential must never reach code that ships or runs.
          # The leading './' is stripped so the allowlist anchors work under
          # both GNU grep (adds it) and BSD grep (does not).
          matches="$(grep -rnI \
            --include='*.js' --include='*.jsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.git \
            -F -- "$PATTERN" . 2>/dev/null | sed 's#^\./##' || true)"

          if [ -z "$matches" ]; then
            echo "No occurrences found."
            exit 0
          fi

          # The three intended local-development fallbacks. Anything else is
          # a regression — see docs/design/DESIGN.md, which used to publish
          # this password as live demo credentials.
          unexpected="$(printf '%s\n' "$matches" \
            | grep -v '^backend/src/seed\.js:' \
            | grep -v '^frontend/e2e/admin\.spec\.js:' \
            | grep -v '^postman/' || true)"

          if [ -n "$unexpected" ]; then
            echo "::error::Hardcoded admin credential found outside the allowlist:"
            printf '%s\n' "$unexpected"
            echo ""
            echo "Allowed only in: backend/src/seed.js, frontend/e2e/admin.spec.js, postman/"
            exit 1
          fi

          echo "Only allowlisted fallbacks present:"
          printf '%s\n' "$matches"

  frontend:
    name: Frontend - Lint, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: Run unit tests
        run: npm run test:run -- --reporter=verbose

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/
          retention-days: 7
          overwrite: true

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend - Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Wait for MongoDB
        env:
          MONGO_URI: mongodb://localhost:27017/portfolio_test
        run: |
          node <<'NODE'
          const mongoose = require('mongoose');

          const uri = process.env.MONGO_URI;
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                await mongoose.connect(uri, { serverSelectionTimeoutMS: 1000 });
                await mongoose.disconnect();
                console.log('MongoDB ready');
                return;
              } catch (error) {
                console.log(`Attempt ${attempt}/30 waiting for MongoDB...`);
                await delay(1000);
              }
            }

            console.error('MongoDB failed to become ready');
            process.exit(1);
          })();
          NODE

      - name: Run integration tests
        env:
          NODE_ENV: test
          PORT: 5050
          MONGO_URI: mongodb://localhost:27017/portfolio_test
          JWT_SECRET: ci_test_secret_github_actions_only
        run: npm run test:coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ./backend/coverage/
          retention-days: 7
          overwrite: true

  e2e:
    name: E2E Tests - Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ./frontend/package-lock.json
            ./backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Wait for MongoDB
        working-directory: ./backend
        env:
          MONGO_URI: mongodb://localhost:27017/portfolio_test
        run: |
          node <<'NODE'
          const mongoose = require('mongoose');

          const uri = process.env.MONGO_URI;
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                await mongoose.connect(uri, { serverSelectionTimeoutMS: 1000 });
                await mongoose.disconnect();
                console.log('MongoDB ready');
                return;
              } catch (error) {
                console.log(`Attempt ${attempt}/30 waiting for MongoDB...`);
                await delay(1000);
              }
            }

            console.error('MongoDB failed to become ready');
            process.exit(1);
          })();
          NODE

      - name: Seed E2E database
        working-directory: ./backend
        env:
          MONGO_URI: mongodb://localhost:27017/portfolio_e2e
        run: npm run seed

      - name: Start backend server
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5055
          MONGO_URI: mongodb://localhost:27017/portfolio_e2e
          JWT_SECRET: ci_test_secret_github_actions_only
        run: npm start > ../backend-server.log 2>&1 &

      - name: Wait for backend server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5055/api/health > /dev/null; then
              echo "Backend server ready"
              exit 0
            fi
            echo "Attempt $i/30 waiting for backend..."
            sleep 1
          done

          echo "Backend server failed to become ready"
          cat backend-server.log || true
          exit 1

      # PF-66 — port and VITE_API_URL must match E2E_WEB_PORT / E2E_API_PORT
      # in frontend/playwright.config.js. Playwright's webServer entries use
      # reuseExistingServer: true unconditionally (not just outside CI),
      # specifically so they attach to the servers started here instead of
      # racing them for the same ports.
      - name: Start frontend dev server
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5055/api
        run: npm run dev -- --host 127.0.0.1 --port 5174 > ../frontend-server.log 2>&1 &

      - name: Wait for frontend dev server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5174 > /dev/null; then
              echo "Frontend dev server ready"
              exit 0
            fi
            echo "Attempt $i/30 waiting for frontend..."
            sleep 1
          done

          echo "Frontend dev server failed to become ready"
          cat frontend-server.log || true
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5055/api
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
          retention-days: 7
          overwrite: true

  audit:
    name: Security - Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ⚠️ REPLACES NOTHING — this check did not exist. All three build jobs run
    # `npm ci --no-audit`, which switches off npm's own vulnerability warning
    # to keep installs quiet and fast. That is the right call inside a build
    # step, but it left the project with no dependency scanning whatsoever.
    # Auditing belongs in its own job, where a finding is a clear signal rather
    # than noise in an install log.
    #
    # `--audit-level=high` means moderate advisories are reported and do not
    # fail the build. A gate that fires on every transitive moderate gets
    # switched off within a month; one that fires on high and critical gets
    # believed.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high

  migrations:
    name: Migrations - Apply and Prove Idempotent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every migration in this repo CLAIMS in its header comment that it is safe
    # to run twice. Nothing checked, and a comment is not a guarantee.
    #
    # ⚠️ This matters because of how deploys actually fail: a migration step
    # that times out half-way WILL be retried, by a pipeline or by a person who
    # cannot tell how far it got. If a migration is not idempotent, that retry
    # is the outage.
    #
    # The script seeds a throwaway database, applies every migration, wipes the
    # TRACKING rows, and applies them all again — then compares the data. See
    # backend/scripts/verify-migrations-idempotent.js for why wiping the
    # tracking rows is the only way to force a genuine second execution.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/portfolio_ci
      JWT_SECRET: ci_test_secret_github_actions_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if node -e "require('mongoose').connect(process.env.MONGO_URI,{serverSelectionTimeoutMS:1000}).then(m=>m.disconnect()).then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
              echo "MongoDB ready"; exit 0
            fi
            echo "Attempt $i/30 waiting for MongoDB..."; sleep 1
          done
          echo "MongoDB failed to become ready"; exit 1

      - name: Seed the throwaway database
        run: npm run seed

      - name: Report migration status
        run: npm run migrate:status

      - name: Apply migrations and prove they are idempotent
        run: npm run migrate:verify

  all-checks-pass:
    name: All Checks Pass
    needs: [credential-scan, audit, migrations, frontend, backend, e2e]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Verify all jobs passed
        run: |
          failed=0

          if [[ "${{ needs.credential-scan.result }}" != "success" ]]; then
            echo "credential-scan failed with result: ${{ needs.credential-scan.result }}"
            failed=1
          fi

          # ⚠️ A job added to `needs:` but NOT checked here would be silently
          # optional: this job would still report success while that one was
          # red, and branch protection trusts this job alone.
          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "audit failed with result: ${{ needs.audit.result }}"
            failed=1
          fi

          if [[ "${{ needs.migrations.result }}" != "success" ]]; then
            echo "migrations failed with result: ${{ needs.migrations.result }}"
            failed=1
          fi

          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "frontend failed with result: ${{ needs.frontend.result }}"
            failed=1
          fi

          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "backend failed with result: ${{ needs.backend.result }}"
            failed=1
          fi

          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "e2e failed with result: ${{ needs.e2e.result }}"
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All required CI jobs passed."
