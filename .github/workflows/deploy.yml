# Production deploy — the CD half of CI/CD.
#
# ── WHAT THIS REPLACES ──────────────────────────────────────────────────────
# Vercel's built-in git integration, which deploys the moment `master` moves.
# That is fast and it has one flaw that cannot be configured away: nothing can
# happen BETWEEN the merge and the deploy. There is no slot for a database
# migration, no approval, and no check afterwards — if the new code needs a
# schema the database does not have yet, it goes live anyway and fails for real
# visitors until someone notices.
#
# ⚠️ THIS WORKFLOW ONLY WORKS ONCE VERCEL'S AUTOMATIC GIT DEPLOYS ARE TURNED
# OFF. Leave both on and every release races itself: Vercel deploys the new
# code immediately while this workflow is still waiting for approval to migrate.
# They are off for `master` in code — `"git": { "deploymentEnabled":
# { "master": false } }` in BOTH frontend/vercel.json and backend/vercel.json
# (PF-126 follow-up). Pull-request preview deploys still run. Delete that key
# and the race comes back.
#
# ── THE ORDER IS THE WHOLE DESIGN ───────────────────────────────────────────
#
#   1. plan      dry-run the migrations against production, save the output
#   2. ⏸ APPROVE  a human reads that output and clicks Approve
#   3. migrate   apply them, recorded in the `migrations` collection
#   4. deploy    push the new code to Vercel
#   5. smoke     prove the deployed site actually serves
#
# Migrations run BEFORE the code, and that is the "expand" half of the
# expand/contract pattern. Adding a field before the code that reads it is safe:
# old code ignores a field it does not know about. The reverse — removing a
# field while code still reads it — is an outage, which is why a destructive
# migration belongs in a LATER release, after the code that stopped using the
# field is already live. See the report in `new mds/E9/`.

name: Deploy to Production

on:
  push:
    branches: [master]
  # Lets you re-run a deploy without an empty commit — after fixing a secret,
  # for instance.
  workflow_dispatch:

permissions:
  contents: read

# ⚠️ `cancel-in-progress: false`, THE OPPOSITE OF ci.yml, and deliberately.
# Cancelling a test run wastes a few minutes. Cancelling a deploy part-way
# through step 3 leaves the database half-migrated with no record of how far it
# got — the single worst state this pipeline can produce. Two pushes in quick
# succession queue instead of interrupting.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: 1 · Plan - what would change
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ⚠️ NOTE: no `environment:` here, so this job needs no approval. Reading
    # is safe, and the whole point is to produce the information the approver
    # needs BEFORE they are asked to approve anything.
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: What has production already applied?
        env:
          MONGO_URI: ${{ secrets.MONGO_URI_PROD }}
        run: npm run migrate:status | tee ../migration-plan.txt

      - name: Dry-run the pending migrations
        env:
          MONGO_URI: ${{ secrets.MONGO_URI_PROD }}
        run: npm run migrate:dry | tee -a ../migration-plan.txt

      # ⚠️ Kept as an artifact so the plan survives the log's retention and can
      # be read next to the approval request. The runner prints the database
      # NAME and never the connection string, so this file is safe to store.
      - name: Save the plan
        uses: actions/upload-artifact@v7
        with:
          name: migration-plan
          path: migration-plan.txt
          retention-days: 30

  migrate:
    name: 2 · Migrate production (needs approval)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan]

    # ⚠️ THIS LINE IS THE APPROVAL GATE. A GitHub "environment" with required
    # reviewers pauses the workflow here until a named person clicks Approve.
    # The pause is the whole reason the environment is named here.
    #
    # ⚠️ IT IS *NOT* WHERE MONGO_URI_PROD LIVES. That one is a REPOSITORY
    # secret, because the `plan` job above deliberately has no `environment:`
    # key (see its own note) and a job outside an environment cannot read that
    # environment's secrets.
    #
    # If MONGO_URI_PROD is unset or malformed, step 1 fails loudly —
    # mongoose.connect() throws on an empty/undefined URI, so a missing
    # secret is caught there, before this gate, not silently. The real
    # silent risk is a URI with NO DATABASE NAME in its path (e.g. missing
    # the trailing /portfolio_prod): the driver connects to "test" without
    # error, and step 1's plan looks normal while describing the wrong
    # database. assertExplicitDatabase() in migrations/run.js now refuses
    # to start when the URI has no database name at all — but it cannot
    # tell "portfolio_prod" from "portfolio_dev" if someone pastes the
    # wrong, well-formed string. That check is still on the approver:
    # read what job 1 printed as "Target database:" before clicking Approve.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply pending migrations
        env:
          MONGO_URI: ${{ secrets.MONGO_URI_PROD }}
        # The runner refuses outright if an already-applied migration has been
        # edited, so a rewritten history stops the release rather than
        # corrupting the database quietly.
        run: npm run migrate

  deploy:
    name: 3 · Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [migrate]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Frontend and backend are two Vercel projects, so each is pulled,
      # built and deployed separately with its own project id.
      #
      # ⚠️ `rm -rf .vercel` BEFORE EVERY PULL. Both projects run from the repo
      # root, so they share one `.vercel/` folder, and `vercel pull` MERGES into
      # the env file it finds there ("Kept … defined locally"). Without the
      # wipe, the frontend build ran with the backend's eleven variable names
      # in its environment (PF-126 follow-up).
      - name: Deploy backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

      # The frontend is built, CHECKED, and only then deployed — three steps,
      # so the check sits in the one slot where a bad bundle can still be
      # stopped.
      - name: Build frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production
          vercel build --prod

      # ⚠️ THE CHECK THE FIRST RUN OF THIS PIPELINE NEEDED (PF-126 follow-up).
      # The API address is baked into the bundle at BUILD time. A Vercel
      # "Sensitive" variable cannot be pulled — `vercel pull` writes the
      # literal string `[SENSITIVE]` instead — and a value in the environment
      # beats the committed `frontend/.env.production`. The bundle shipped with
      # `[SENSITIVE]` as its API address, every request went to the SPA host,
      # and every job here was green: the smoke test only looks at the backend.
      - name: Check the built frontend
        env:
          API_ORIGIN: ${{ vars.PRODUCTION_API_URL }}
        run: |
          API_ORIGIN="${API_ORIGIN%/}"
          if [ -z "$API_ORIGIN" ]; then
            echo "::error::vars.PRODUCTION_API_URL is empty — nothing to check the bundle against."
            exit 1
          fi
          if grep -rlF '[SENSITIVE]' .vercel/output; then
            echo "::error::The build contains a [SENSITIVE] placeholder — a Vercel Sensitive variable reached the bundle unreadable."
            exit 1
          fi
          if ! grep -lF "$API_ORIGIN" .vercel/output/static/assets/*.js; then
            echo "::error::No script in the build contains $API_ORIGIN — the site would call itself instead of the API."
            exit 1
          fi

      - name: Deploy frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod

  smoke:
    name: 4 · Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ ASSERTS `/api/health`'s `database` FIELD, NEVER THE STATUS CODE.
      # That endpoint is registered ahead of the connectDB middleware and
      # swallows connection errors, so it answers 200 with `database: null`
      # while the database is unreachable. This project has had exactly that
      # outage with every status-code monitor green throughout.
      - name: Smoke test the live API and site
        working-directory: ./backend
        run: node scripts/smoke-test.js "${{ vars.PRODUCTION_API_URL }}" portfolio_prod "${{ vars.PRODUCTION_URL }}"

      - name: Report
        if: failure()
        run: |
          echo "::error::Production is not healthy after deploy."
          echo "Roll the CODE back in the Vercel dashboard (instant rollback)."
          echo ""
          echo "⚠️ Do NOT try to roll the MIGRATION back. Migrations here are"
          echo "   forward-only: a mistake is corrected by writing the next"
          echo "   numbered migration, never by reversing one. A reversal has"
          echo "   to guess what the data looked like before, and it guesses"
          echo "   wrong for every row that changed since."
