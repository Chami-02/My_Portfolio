# Claude on GitHub — mention @claude in an issue or pull request comment.
#
# WHAT IT DOES, in plain terms: when the OWNER writes a comment containing
# "@claude" on an issue or a pull request, GitHub starts this workflow. It runs
# Claude Code (Anthropic's official action) on a GitHub machine with a copy of
# the repository. Claude reads the request, can answer, review, or make changes
# on a BRANCH, and replies as a comment on the same issue / PR.
#
# Based on Anthropic's official example (code.claude.com/docs/en/github-actions,
# read 2026-10-05).
#
# ⚠️ WHO CAN TRIGGER IT — two locks:
#   1. The action itself refuses anyone without WRITE access to this repo, so a
#      stranger commenting "@claude" on this public repo is rejected.
#   2. The `if:` below goes further: only the repository OWNER's comments start a
#      run at all — not even a future collaborator, unless this line is changed.
#      This stops anyone else spending the owner's Claude usage or trying to
#      trick the bot with instructions hidden in a comment (prompt injection).
#
# ⚠️ WHAT IT CANNOT DO: master is protected (a PR and a green "All Checks Pass"
# are required), so Claude can never change the live site directly. Anything it
# writes lands on a branch / PR for the owner to review and merge.
#
# ⚠️ COST: authenticates with the owner's Claude SUBSCRIPTION token
# (CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`), so runs count
# against the existing Claude plan's usage — no separate API bill. GitHub
# minutes are free on a public repo. `--max-turns` and `timeout-minutes` cap how
# much one request can use.
#
# ⚠️ PREREQUISITES (owner): install the Claude GitHub App on this repo, and add
# the repository secret CLAUDE_CODE_OAUTH_TOKEN. Until the secret exists, a
# mention simply fails to authenticate — nothing else breaks.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One Claude run per issue/PR at a time; a second mention queues behind it.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # write to a branch (never master — protected)
      pull-requests: write   # comment on / open pull requests
      issues: write          # comment on issues
      id-token: write        # required by the action's GitHub App authentication
      actions: read          # lets Claude read CI results on a PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 15"
