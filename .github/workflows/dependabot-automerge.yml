# Dependabot auto-merge — let SAFE updates merge themselves.
#
# WHAT IT DOES, in plain terms: when Dependabot opens a pull request, this
# workflow reads what kind of update it is and applies the owner's policy
# (2026-10-05, "industry-typical"):
#
#   dev tools + GitHub Actions   patch ✅ auto   minor ✅ auto   major ✋ owner
#   live-site packages           patch ✅ auto   minor ✋ owner   major ✋ owner
#   build tools (vite, @vitejs)  treated as live-site: they build what ships
#
# For a ✅ it switches on GitHub's "auto-merge" for that PR. For a ✋ it posts a
# comment saying the PR is waiting for the owner.
#
# ⚠️ "Auto-merge" does NOT mean "merge now". It means "merge AS SOON AS every
# required check is green". Branch protection on master requires the
# "All Checks Pass" check (unit tests, coverage, E2E, audit…), so an update
# that breaks anything simply never merges — it sits there red, for a human.
#
# ⚠️ WHY LIVE-SITE MINORS AND ALL MAJORS WAIT: merging to master deploys the
# live site (Vercel). A minor live-site update could pass every test and still
# change something no test covers; a major may remove things and need code
# changes. Dev tools never run on the live site, so a bad one cannot break what
# visitors see — CI would catch a broken tool as a red build.
#
# ⚠️ WHY THE RULE READS THE *GROUP NAME*: Dependabot bundles updates into
# groups (.github/dependabot.yml). The groups are split so that dev tools and
# live-site packages never share a PR; the group name is therefore an exact
# statement of what is inside. A single, ungrouped PR (e.g. a security fix) is
# judged on its own dependency type instead.
#
# ⚠️ WHY `pull_request_target` IS SAFE HERE: that trigger runs with a token that
# can write to the repo. It is dangerous when a workflow CHECKS OUT and RUNS the
# pull request's code. This one never checks anything out — it only reads the
# PR's metadata and calls `gh pr merge`. It is the trigger GitHub's own
# documentation uses for exactly this job.
#
# Prerequisite: Settings → General → "Allow auto-merge" must be ticked.

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write        # needed to merge
  pull-requests: write   # needed to enable auto-merge and to comment

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Only Dependabot's own PRs, and only in THIS repository (never a fork).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Chami-02/My_Portfolio'
    steps:
      - name: Read what this update is
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Decide — is it a safe update?
        id: decide
        env:
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          safe=false
          case "$UPDATE" in
            version-update:semver-patch) SIZE="patch" ;;
            version-update:semver-minor) SIZE="minor" ;;
            *) SIZE="major" ;;          # major, or unknown: never automatic
          esac
          # A grouped PR is judged by its group (the groups never mix kinds);
          # a single PR by its own dependency type.
          case "$GROUP" in
            frontend-dev-tools|backend-dev-tools|github-actions) KIND="tool" ;;
            frontend-site-patch|backend-site-patch|frontend-site-minor|backend-site-minor) KIND="site" ;;
            # Build tools ship what visitors download: live-site rules.
            frontend-build-patch|frontend-build-minor) KIND="site" ;;
            "")
              if [ "$DEP_TYPE" = "direct:development" ] || [ "$ECOSYSTEM" = "github_actions" ]; then KIND="tool"
              elif [ "$DEP_TYPE" = "direct:production" ]; then KIND="site"
              else KIND="unknown"           # indirect (transitive) deps: owner decides
              fi ;;
            *) KIND="unknown" ;;            # a group this file does not know: refuse
          esac
          if [ "$KIND" = tool ] && { [ "$SIZE" = patch ] || [ "$SIZE" = minor ]; }; then safe=true; fi
          if [ "$KIND" = site ] && [ "$SIZE" = patch ]; then safe=true; fi
          echo "kind=$KIND size=$SIZE" 
          echo "group=${GROUP:-none} type=$DEP_TYPE ecosystem=$ECOSYSTEM update=$UPDATE -> safe=$safe"
          echo "safe=$safe" >> "$GITHUB_OUTPUT"

      - name: Safe — merge automatically once every check is green
        if: steps.decide.outputs.safe == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Not auto-mergeable — leave it for the owner
        if: steps.decide.outputs.safe != 'true'
        run: |
          gh pr comment "$PR_URL" --body "🤖 Not auto-merged: live-site minor updates, all major updates and indirect dependencies wait for the owner to review and merge."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
