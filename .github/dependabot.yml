# Dependabot — automated dependency updates.
#
# WHAT IT DOES, in plain terms: once a week GitHub checks whether any package
# this project depends on has released a newer version, and opens a pull
# request for it. CI runs against that PR, so you can see whether the update
# breaks anything BEFORE it is merged.
#
# WHY IT EXISTS: the alternative is noticing a vulnerable dependency months
# later, during an audit, with no idea whether upgrading is safe. A weekly PR
# that CI has already tested turns a security chore into a review.
#
# ⚠️ Dependabot reads THIS FILE FROM THE DEFAULT BRANCH (`master`) ONLY. A copy
# on any other branch does nothing — which is why this file arrived on master
# through its own small PR (chore/github-bots, 2026-10-05).
#
# ⚠️ FREE ON THIS REPO because it is public.
#
# ── WHY THE GROUPS ARE SPLIT (2026-10-05, owner: "industry-typical") ────────
# "development" packages (test, lint and build tools: jest, vitest, eslint,
# playwright, nodemon…) never run on the live site. "production" packages
# (react, express, mongoose…) ARE the live site. Keeping them in SEPARATE
# pull requests is what lets .github/workflows/dependabot-automerge.yml treat
# them differently. Live-site packages are ALSO split by size, patch vs minor,
# because the policy differs:
#
#   dev tools + GitHub Actions   patch ✅ auto   minor ✅ auto   major ✋ owner
#   live-site packages           patch ✅ auto   minor ✋ owner   major ✋ owner
#   build tools (vite, @vitejs)  same as live-site — they build what ships
#
# ("auto" = merges itself once EVERY required check is green.)
# MAJOR updates are never grouped — each arrives as its own PR, because a major
# version may remove things and need code changes. One exception: the vitest
# family (frontend-vitest below), whose packages cannot move apart.
#
# ⚠️ Note the THIRD ecosystem. Dependabot also updates the GitHub Actions the
# workflows use (actions/checkout, actions/setup-node…). Those run with access
# to the repository, so an unmaintained action is a supply-chain risk of its
# own — a category people forget because it is not in package.json.

version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    # Patch and minor bumps grouped into ONE pull request per kind. Ungrouped,
    # a busy week produces a dozen PRs, they stop being read, and the useful
    # one — a security fix — is lost in the noise.
    groups:
      # ⚠️ BUILD TOOLS FIRST (owner, 2026-10-05). vite and its React plugin are
      # devDependencies but they PRODUCE the files visitors download, so they
      # follow the live-site policy (patch auto, minor waits). Dependabot puts a
      # package in the FIRST group it matches, so these must stay above
      # frontend-dev-tools or vite would be swept into the tools group.
      frontend-build-patch:
        patterns: ["vite", "@vitejs/*"]
        update-types: [patch]
      frontend-build-minor:
        patterns: ["vite", "@vitejs/*"]
        update-types: [minor]
      # ⚠️ VITEST MOVES AS ONE FAMILY, majors included. @vitest/coverage-v8
      # pins the EXACT vitest version it was released with, so a lone vitest
      # bump can never install (ERESOLVE — #16, vitest 5, 2026-10-15). This is
      # the one exception to "majors are never grouped". Above
      # frontend-dev-tools for the same first-match reason as the build group.
      frontend-vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: [major, minor, patch]
      frontend-dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      frontend-site-patch:
        dependency-type: production
        update-types: [patch]
      frontend-site-minor:
        dependency-type: production
        update-types: [minor]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      backend-dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      backend-site-patch:
        dependency-type: production
        update-types: [patch]
      backend-site-minor:
        dependency-type: production
        update-types: [minor]
    # ⚠️ TEMPORARY HOLD (2026-10-15) — REMOVE WHEN NODE-7832 SHIPS.
    # mongodb >= 7.6 loads `os` with a dynamic import() that fails silently
    # under Jest, so the handshake is sent without its `driver` field, the
    # server rejects it, and every database test hangs until CI's timeout
    # (#31). Plain Node is unaffected — this is a TEST-ONLY break, but a suite
    # that cannot run proves nothing. mongoose >= 9.10 requires mongodb ~7.6+,
    # so it is held too. package.json pins `~7.5.0` / `~9.9.1` (patches only).
    # Upstream: https://github.com/typegoose/mongodb-memory-server/issues/1026
    # To lift: delete this block, set both back to `^`, run the backend suite.
    #
    # ⚠️ HOLD (2026-10-19) — cookie 2.x is ESM-ONLY (`"type": "module"`).
    # The backend is CommonJS: Node 24 can require() an ES module, but Jest's
    # module loader cannot ("Must use import to load ES Module"), so every
    # suite that loads app.js (authController reads the Google flow cookie)
    # fails before it starts (#39). 1.x is maintained, so patches and minors
    # still arrive. To lift: when Jest can load it (or the backend moves to
    # ESM), delete this entry and run the backend suite.
    ignore:
      - dependency-name: mongodb
        versions: [">=7.6.0"]
      - dependency-name: mongoose
        versions: [">=9.10.0"]
      - dependency-name: cookie
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
