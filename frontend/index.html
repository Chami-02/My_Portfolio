<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PF-146: the site logo, the same in both themes. The .ico holds 16, 32
         and 48px; the 96px PNG is for sharp screens. iOS home screens use the
         180px PNG. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parindra Gallage — Let's Make It Real</title>
    <meta name="description" content="Building clean, containerized web applications with the MERN stack." />

    <!-- Link previews (LinkedIn, WhatsApp, Slack…): the same title and
         description as above. These readers don't run the site's JavaScript,
         so every shared link shows this same card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parindra Gallage" />
    <meta property="og:title" content="Parindra Gallage — Let's Make It Real" />
    <meta property="og:description" content="Building clean, containerized web applications with the MERN stack." />
    <meta property="og:url" content="https://parindragallage.com/" />
    <meta property="og:image" content="https://parindragallage.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Parindra Gallage among the stars, with the words Let's make it real" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PF-149: the name Google shows above a result instead of the bare address
         (Google Search Central, "site names"). The domain comes last as Google's
         recommended fallback. Data the browser never runs, so the CSP's script
         hash does not apply to it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Parindra Gallage",
        "alternateName": ["parindragallage.com"],
        "url": "https://parindragallage.com/"
      }
    </script>

    <!-- ── FOUC guard (PF-71) ───────────────────────────────────
         Applies the saved theme before first paint. Must stay inline
         and blocking — a deferred or external script would run after
         the browser has already painted, which is the flash this
         prevents. See PF-72 for the runtime theme provider.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pg-theme');
          // PF-72: ThemeProvider must read this attribute in its useState
          // initializer, not assume 'dark' and correct in a useEffect —
          // that would reintroduce the flash as a React re-render.
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' ? 'light' : 'dark'
          );
        } catch (e) {
          // localStorage throws in Safari private mode and when cookies
          // are blocked. Falling through leaves the default dark theme,
          // which is correct — never let this break page load.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Fonts (PF-68: one request for every family). PF-116 dropped Inter:
         Phase 1's body font, unread once body moved to Space Grotesk. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm3Kz-C8CSKlv.woff2">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
