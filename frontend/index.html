<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PF-134: the site logo. The .ico is for browsers without SVG favicons
         (sizes="32x32" stops Chrome preferring it over the SVG). The SVG
         starts dark (the default theme) and applyTheme() in utils/theme.js
         swaps it to favicon-light.svg with the site's toggle. iOS home
         screens use the 180px PNG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parindra Gallage — Full-Stack Developer</title>
    <meta name="description" content="Full-Stack Developer specializing in the MERN stack. Building clean, containerized web applications." />

    <!-- Link previews (LinkedIn, WhatsApp, Slack…): the same title and
         description as above. og:url and og:image need an ABSOLUTE address,
         so they wait for the custom domain rather than pinning a vercel.app
         one that is about to change. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parindra Gallage" />
    <meta property="og:title" content="Parindra Gallage — Full-Stack Developer" />
    <meta property="og:description" content="Full-Stack Developer specializing in the MERN stack. Building clean, containerized web applications." />
    <meta name="twitter:card" content="summary" />

    <!-- ── FOUC guard (PF-71) ───────────────────────────────────
         Applies the saved theme before first paint. Must stay inline
         and blocking — a deferred or external script would run after
         the browser has already painted, which is the flash this
         prevents. See PF-72 for the runtime theme provider.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pg-theme');
          // PF-72: ThemeProvider must read this attribute in its useState
          // initializer, not assume 'dark' and correct in a useEffect —
          // that would reintroduce the flash as a React re-render.
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' ? 'light' : 'dark'
          );
        } catch (e) {
          // localStorage throws in Safari private mode and when cookies
          // are blocked. Falling through leaves the default dark theme,
          // which is correct — never let this break page load.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Fonts (PF-68: one request for every family). PF-116 dropped Inter:
         Phase 1's body font, unread once body moved to Space Grotesk. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm3Kz-C8CSKlv.woff2">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
