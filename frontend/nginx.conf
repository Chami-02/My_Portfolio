# Serves the React SPA and handles all routing correctly.

# Long cache for hashed assets, nothing for the HTML (an empty value adds no
# header). A `map` lives at http level — conf.d files are included there.
map $uri $asset_cache_control {
    ~*\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$  "public, max-age=31536000, immutable";
    default                                                      "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React Router support ──────────────────────────────────────────────────
    # For every URL, try to serve the file, then the directory, then fall back
    # to index.html. This lets React Router handle /admin, /blog/slug, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy to backend ──────────────────────────────────────────────────
    # In production on Railway, you'll set VITE_API_URL to the backend URL.
    # This nginx proxy block is only needed if you deploy frontend+backend together.
    # For Vercel+Railway (our setup), this block can be removed.

    # ── Cache static assets aggressively ────────────────────────────────────
    # Vite bundles JS/CSS with content hashes in filenames — safe to cache
    # forever. ⚠️ No `add_header` in here: nginx drops EVERY inherited
    # add_header from a location that declares its own, so the old
    # `add_header Cache-Control` in this block silently stripped the security
    # headers below from every asset. Cache-Control comes from the map above.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
        access_log off;   # Don't log every image request
    }

    add_header Cache-Control $asset_cache_control always;

    # ── Security headers — the SAME policy as vercel.json (PF-120) ────────────
    # One difference: connect-src names the API the Docker setup exposes
    # (docker-compose maps the backend to localhost:5050) instead of the
    # production API. The script hash is the inline FOUC script's, as in
    # vercel.json; securityHeaders.test.js pins both files to each other.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0zcd3X9ExfQRhf7MnJ8E7KVwhOG8hiTmDh/4klY9O0I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' http://localhost:5050; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options         "DENY"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript;
}